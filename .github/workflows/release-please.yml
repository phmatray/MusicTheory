name: release-please

# Derives the next version from the Conventional Commits on `dev` (the default branch) and keeps a
# release PR up to date: CHANGELOG.md, .release-please-manifest.json and the single <Version> in
# Directory.Build.props (x-release-please-version marker). Merging that PR tags vX.Y.Z and creates
# the GitHub Release; the publish job below then pushes MusicTheory and MusicTheory.Guitar to NuGet.
#
# Publishing lives in THIS workflow, gated on `release_created`: a tag created by release-please with
# GITHUB_TOKEN does not trigger other workflows. PRs are squash-merged, so the PR title decides the bump.

on:
  push:
    branches: [dev]
  # Manual re-run: refreshes the release PR, or finishes a merged release whose run failed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # release-please creates the `autorelease: pending` label it uses to find the merged release PR.
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Pack & publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      # Every IsPackable project (MusicTheory, MusicTheory.Guitar, ...) at the one shared version.
      - name: Pack
        run: |
          dotnet pack -c Release -o artifacts
          ls -1 artifacts

      # Pushing a .nupkg also pushes the .snupkg next to it. --skip-duplicate keeps re-runs idempotent.
      - name: Push to NuGet
        run: |
          set -e
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" -k "${{ secrets.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" artifacts/*.nupkg artifacts/*.snupkg --clobber
