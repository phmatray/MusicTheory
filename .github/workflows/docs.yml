name: Site

# Builds the site with tools/SiteGen (docs/*.md, the API reference from the XML docs, and the home page
# whose code samples are evaluated against the library) and publishes it to GitHub Pages from dev.
on:
  push:
    branches: [ dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys from dev share one queue; each pull request gets its own, so a PR build is never cancelled by another PR.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
        global-json-file: global.json
    - name: Build the site
      run: dotnet run --project tools/SiteGen -c Release -- . _site
    - name: Upload the site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
