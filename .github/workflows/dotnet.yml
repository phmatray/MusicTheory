name: .NET

on:
  push:
    branches: [ dev, main ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Library tests (with music21 reference tables), guitar tests (with golden files) and the
    # documentation tests, which compile, run and check the output of every C# block in docs/.
    - name: Test
      run: dotnet test --no-build --configuration Release --report-xunit-trx --report-xunit-trx-filename test-results.trx

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: "**/test-results.trx"

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
        global-json-file: global.json
    - name: Build
      run: dotnet build --configuration Release
    - name: Measure coverage
      run: |
        dotnet test --no-build -c Release --project MusicTheory.UnitTests --coverage --coverage-output-format cobertura --coverage-output "$PWD/TestResults/core.cobertura.xml"
        dotnet test --no-build -c Release --project MusicTheory.Guitar.UnitTests --coverage --coverage-output-format cobertura --coverage-output "$PWD/TestResults/guitar.cobertura.xml"
        dotnet test --no-build -c Release --project MusicTheory.ChordPro.UnitTests --coverage --coverage-output-format cobertura --coverage-output "$PWD/TestResults/chordpro.cobertura.xml"
    # Fails unless MusicTheory, MusicTheory.Guitar, MusicTheory.Guitar.Blazor and MusicTheory.ChordPro are at 100% of lines and branches.
    - name: Require 100% coverage
      run: python3 tools/coverage/check.py TestResults/*.xml

  publish:
    runs-on: ubuntu-latest
    needs: [build, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Pack
      run: dotnet pack --no-build --configuration Release --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./artifacts/*.*nupkg
