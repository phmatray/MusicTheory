name: Release

# Releases are cut from the default branch (dev) on demand: Actions > Release > Run workflow.
# The next version comes from the conventional commits since the last v* tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Check for existing tags
      id: check_tags
      run: |
        if git describe --tags --abbrev=0 2>/dev/null; then
          echo "has_tags=true" >> $GITHUB_OUTPUT
          echo "Found existing tags"
        else
          echo "has_tags=false" >> $GITHUB_OUTPUT
          echo "No tags found - will create initial release"
        fi
    
    - name: Get next version
      id: get_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        release_branches: dev
        dry_run: true
        default_bump: ${{ steps.check_tags.outputs.has_tags == 'false' && 'major' || 'false' }}
        custom_release_rules: |
          breaking:major,
          feat:minor,
          fix:patch,
          perf:patch,
          revert:patch,
          docs:patch:README,
          refactor:patch,
          test:false,
          style:false,
          chore:false,
          ci:false
    
    
    - name: Check if should release
      id: should_release
      run: |
        if [[ "${{ steps.get_version.outputs.new_version }}" != "" ]]; then
          echo "new_release=true" >> $GITHUB_OUTPUT
          echo "New version will be: ${{ steps.get_version.outputs.new_version }}"
        else
          echo "new_release=false" >> $GITHUB_OUTPUT
          echo "No new version to release"
        fi
    
    - name: Setup .NET
      if: steps.should_release.outputs.new_release == 'true'
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    
    - name: Restore dependencies
      if: steps.should_release.outputs.new_release == 'true'
      run: dotnet restore
    
    - name: Build
      if: steps.should_release.outputs.new_release == 'true'
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.new_version }}
    
    - name: Test
      if: steps.should_release.outputs.new_release == 'true'
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Pack
      if: steps.should_release.outputs.new_release == 'true'
      run: dotnet pack --configuration Release --no-build -p:Version=${{ steps.get_version.outputs.new_version }} --output ./artifacts
    
    - name: Generate changelog
      if: steps.should_release.outputs.new_release == 'true'
      id: changelog
      uses: TriPSs/conventional-changelog-action@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        version-file: './Directory.Build.props'
        version-path: '//Project/PropertyGroup/Version'
        skip-version-file: true
        skip-commit: true
        output-file: false
    
    - name: Create tag
      if: steps.should_release.outputs.new_release == 'true'
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        custom_tag: ${{ steps.get_version.outputs.new_version }}
    
    - name: Push to NuGet
      if: steps.should_release.outputs.new_release == 'true'
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Create GitHub Release
      if: steps.should_release.outputs.new_release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.new_version }}
        name: Release v${{ steps.get_version.outputs.new_version }}
        body: ${{ steps.changelog.outputs.clean_changelog }}
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}